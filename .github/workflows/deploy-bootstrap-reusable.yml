name: Deploy bootstrap (reusable)

on:
  workflow_call:
    inputs:
      config_path:
        description: "Path to the bootstrap JSON config file (relative to the caller repo root)"
        type: string
        required: true
      github_environment:
        description: "GitHub environment name (for secrets/vars scoping)"
        type: string
        required: true
      aws_region:
        description: "AWS region to deploy into"
        type: string
        required: false
        default: ap-southeast-2
      role_to_assume:
        description: "IAM role ARN to assume via OIDC"
        type: string
        required: true
      stack_selector:
        description: "CDK stack selector, e.g. --all or a specific stack ID"
        type: string
        required: false
        default: "--all"
      caller_ref:
        description: "Optional ref of the caller repo to check out"
        type: string
        required: false
        default: ""
    secrets:
      FORCE_RUN_TOKEN:
        description: "Optional token to force re-run of custom resources (pass github.sha)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    concurrency:
      group: gen3-bootstrap-${{ inputs.github_environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.caller_ref != '' && inputs.caller_ref || github.ref }}
          path: caller

      - name: Checkout shared bootstrap repo
        uses: actions/checkout@v6
        with:
          repository: AustralianBioCommons/gen3-platform-bootstrap
          ref: main
          path: bootstrap

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve AWS account id
        id: aws_identity
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Build runtime config
        env:
          CONFIG_PATH: caller/${{ inputs.config_path }}
          AWS_ACCOUNT_ID: ${{ steps.aws_identity.outputs.account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          TARGET_ENV: ${{ inputs.github_environment }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const config = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, 'utf8'));

          for (const [key, env] of Object.entries(config.environments || {})) {
            if (!env.account || env.account === '__ACCOUNT_ID__') {
              env.account = process.env.AWS_ACCOUNT_ID;
            }
            if (!env.region) {
              env.region = process.env.AWS_REGION;
            }
            config.environments[key] = env;
          }

          config.stages = (config.stages || []).filter(
            (stage) => stage.envKey === process.env.TARGET_ENV
          );

          if (config.stages.length === 0) {
            throw new Error(`No stages found for envKey='${process.env.TARGET_ENV}'`);
          }

          fs.writeFileSync('bootstrap/config.runtime.json', JSON.stringify(config, null, 2));
          console.log(`Wrote bootstrap/config.runtime.json with ${config.stages.length} stage(s)`);
          NODE

      - name: Install dependencies
        working-directory: bootstrap
        run: npm ci

      - name: CDK synth
        working-directory: bootstrap
        env:
          FORCE_RUN_TOKEN: ${{ secrets.FORCE_RUN_TOKEN || github.sha }}
        run: npx cdk synth -c config=./config.runtime.json

      - name: CDK deploy
        working-directory: bootstrap
        env:
          FORCE_RUN_TOKEN: ${{ secrets.FORCE_RUN_TOKEN || github.sha }}
        run: |
          npx cdk deploy ${{ inputs.stack_selector }} \
            --require-approval never \
            -c config=./config.runtime.json
